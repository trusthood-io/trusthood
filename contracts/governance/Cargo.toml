[package]
name = "trusthood-governance"
version = "0.1.0"
edition = "2021"
publish = false
description = "Decentralized governance contract for TrustHoodEscrow protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = [] }
trusthood-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
